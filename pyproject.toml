[project]
name = "asn-gan"
version = "1.0.0"
description = "ASN-GAN: 代理化社交网络对抗生成引擎 ·「干出来的才是王」"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38.0",
    "python-dotenv>=1.0.1",
    "openai>=1.58.1",
    "requests>=2.32.3",
    "pymysql>=1.1.0",
]

[tool.setuptools]
packages = ["core", "debate"]

[tool.uv]
managed = true
