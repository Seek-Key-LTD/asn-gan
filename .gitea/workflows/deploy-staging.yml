name: Deploy Staging (NUC)
on:
  push:
    branches:
      - dev

jobs:
  deploy-staging:
    runs-on: nuc2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Rsync to staging dir (Projects大写P·运行目录)
        run: |
          set -e
          echo "🚀 [CI/CD] dev → NUC staging 同步..."
          rsync -az --exclude '.git' --exclude '.venv' --exclude '__pycache__' --exclude 'node_modules' --exclude 'chainlit.db' --exclude '.files' ./ /home/ben/Projects/github/kunpengzhi-ai/
          echo "✅ Staging部署完成 (不删运行时文件)"

      - name: Restart chainlit staging
        run: |
          # 杀掉8501上的streamlit(历史遗留)和旧chainlit
          pkill -f "streamlit run streamlit_app.py" 2>/dev/null || true
          pkill -f "chainlit run app.py" 2>/dev/null || true
          sleep 2
          # 起chainlit
          cd /home/ben/Projects/github/kunpengzhi-ai
          nohup .venv/bin/chainlit run app.py -h --port 8501 > /tmp/kunpengzhi-staging.log 2>&1 &
          sleep 5

      - name: Health check
        run: |
          curl -s -o /dev/null -w "staging(8501) HTTP %{http_code}\n" http://127.0.0.1:8501/lobby
          curl -s -o /dev/null -w "root(8501) HTTP %{http_code}\n" http://127.0.0.1:8501/
